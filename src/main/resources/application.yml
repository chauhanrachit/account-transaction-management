server:
  port: 8080

spring:
  application:
    name: account-transaction-management

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

logging:
  level:
    root: INFO

security:
  jwt:
    secret: "dev-secret-key-change-this-later-very-long"
    expiration-ms: 3600000 # 1 hour